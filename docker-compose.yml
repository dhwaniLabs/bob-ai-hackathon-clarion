version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: clarion_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clarion
      POSTGRES_PASSWORD: clarion_secret_password_2026
      POSTGRES_DB: clarion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clarion -d clarion_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: clarion_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://clarion:clarion_secret_password_2026@db:5432/clarion_db
      - WATSONX_API_KEY=${WATSONX_API_KEY:-}
      - WATSONX_PROJECT_ID=${WATSONX_PROJECT_ID:-}
      - WATSONX_URL=${WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
      - WATSONX_MODEL_ID=${WATSONX_MODEL_ID:-ibm/granite-3-8b-instruct}
      - CORRELATION_WINDOW_MINUTES=30
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: clarion_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
