[project]
name = "clarion-backend"
version = "1.0.0"
description = "CLARION Threat Intelligence Correlation Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pytest>=8.0.0"
]

[tool.vercel]
entrypoint = "main.py"
